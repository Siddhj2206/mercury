# Shared os-release / image-info.json generator; instantiating elements
# set %{os-release-repo} (oci/os-release.bst).
# If an instantiating element declares its own build-depends, YAML
# composition REPLACES this list (no merge) — carry sandbox-tools along.
build-depends:
  - core/sandbox-tools.bst

depends:
  - freedesktop-sdk.bst:public-stacks/runtime-minimal.bst

variables:
  strip-binaries: ""

environment:
  IMAGE_NAME: "%{os-release-repo}"
  IMAGE_VENDOR: "siddhj2206"
  IMAGE_REF: "ostree-image-signed:docker://ghcr.io/siddhj2206/%{os-release-repo}"
  IMAGE_FLAVOR: "main"
  # image-info.json only: the real tag is known at runtime, not build time
  # (one digest is published as :testing and promoted to :stable). os-release
  # carries no tag.
  IMAGE_TAG: "latest"
  VERSION_ID: "0"
  IMAGE_VERSION: "0"

  IMAGE_PRETTY_NAME: "Mercury"
  VENDOR_NAME: "siddhj2206"
  VENDOR_URL: "https://github.com/siddhj2206/mercury"
  HOME_URL: "https://github.com/siddhj2206/mercury"
  DOCUMENTATION_URL: "https://github.com/siddhj2206/mercury"
  SUPPORT_URL: "https://github.com/siddhj2206/mercury/issues"
  BUG_SUPPORT_URL: "https://github.com/siddhj2206/mercury/issues"
  CODE_NAME: "Mercury"
  ID: "mercury"

config:
  build-commands:
    - mkdir -p %{install-root}%{indep-libdir}/
    - |
      cat >"%{install-root}%{indep-libdir}/os-release" <<EOF
      NAME="${IMAGE_PRETTY_NAME}"
      ID="${ID}"
      ID_LIKE="org.gnome.os"
      VERSION_CODENAME="${CODE_NAME}"
      PRETTY_NAME="${IMAGE_PRETTY_NAME}"
      VENDOR_NAME="${VENDOR_NAME}"
      VENDOR_URL="${VENDOR_URL}"
      BUG_REPORT_URL="${BUG_SUPPORT_URL}"
      HOME_URL="${HOME_URL}"
      DOCUMENTATION_URL="${DOCUMENTATION_URL}"
      SUPPORT_URL="${SUPPORT_URL}"
      LOGO=img-logo-icon
      DEFAULT_HOSTNAME="mercury"
      IMAGE_ID="${IMAGE_NAME}"
      IMAGE_NAME="${IMAGE_NAME}"
      IMAGE_VENDOR="${IMAGE_VENDOR}"
      IMAGE_REF="${IMAGE_REF}"
      IMAGE_FLAVOR="${IMAGE_FLAVOR}"
      VERSION_ID="${VERSION_ID}"
      IMAGE_VERSION="${IMAGE_VERSION}"
      EOF
      mkdir -p %{install-root}%{sysconfdir}/
      ln -sf ../usr/lib/os-release %{install-root}%{sysconfdir}/os-release

    - |
      # umotd takes the first NAME="..." match as the OS name, so
      # NAME= must precede PRETTY_NAME=, VENDOR_NAME= and IMAGE_NAME=. The
      # sandbox has only bash and coreutils, so no sed or grep here.
      first=""
      while IFS= read -r line; do
        case "${line}" in *NAME=\"*) first="${line}"; break ;; esac
      done <"%{install-root}%{indep-libdir}/os-release"
      if [ "${first}" != "NAME=\"${IMAGE_PRETTY_NAME}\"" ]; then
        echo "ERROR: os-release must list NAME= before any other *NAME= field" >&2
        exit 1
      fi

    - mkdir -p "%{install-root}%{datadir}/mercury"
    - |
      cat >"%{install-root}%{datadir}/mercury/image-info.json" <<EOF
      {
        "image-name": "${IMAGE_NAME}",
        "image-ref": "${IMAGE_REF}",
        "image-flavor": "${IMAGE_FLAVOR}",
        "image-vendor": "${IMAGE_VENDOR}",
        "image-tag": "${IMAGE_TAG}"
      }
      EOF
