# systemd-oomd kills the unit under this slice with the most reclaim activity
# once memory pressure stays above the limit, before the whole desktop stalls.
# Same policy as Fedora's systemd-oomd-defaults. session.slice (niri, DMS)
# deliberately has none: oomd picks a whole unit, and that would be the
# session. Apps get their own units via niri scopes and DMS's launch prefix.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=80%
