# gbm builds the OCI initramfs with dracut (gnomeos/initramfs/image.bst), so
# drop-ins here do apply. Mercury has no NVIDIA support; keep its drivers out.
# Every byte here is read by GRUB on each boot; nouveau's GSP firmware alone
# was 100 MB of base-atomic's 236 MB image. build/50-initramfs.sh applies this.
omit_drivers+=" nouveau nova_core nova_drm "
