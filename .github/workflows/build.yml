name: Build Mercury

# One stream, one image. Pushes to main build, sign, boot-test, and publish
# ghcr.io/<owner>/mercury:latest plus a dated tag. Pull requests build,
# rechunk, and boot-test only — they never sign and never push.
#
# Label a same-repo PR `build` to trigger the expensive BST build; unlabeled
# PRs run validate.yml only.

on:
  push:
    branches: [main]
    paths:
      - "elements/**"
      - "files/**"
      - "plugins/**"
      - "patches/**"
      - "Justfile"
      - "project.conf"
      - "include/**"
      - "scripts/bst_ghcr_cache.py"
      - ".github/workflows/build.yml"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      continuation:
        description: Continuation count for a build that hit the time budget (set automatically)
        required: false
        default: '0'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions: read-all

env:
  IMAGE_NAME: mercury
  # OCI refs must be lowercase; github.repository_owner preserves the
  # account's display-case (Siddhj2206), which oras/skopeo reject.
  IMAGE_REGISTRY: ghcr.io/siddhj2206

concurrency:
  group: mercury-build-${{ github.ref }}
  # Never cancel a main publish mid-run: a cancelled sign/push can leave a
  # half-tagged image. PR builds may cancel; main serializes instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    # PRs build only when a maintainer adds the `build` label (same-repo
    # branches only — fork PRs never reach the signing/publish steps).
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'build') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04
    # GitHub caps hosted jobs at 360 min.
    timeout-minutes: 355
    permissions:
      contents: read
      # Artifact cache packs in ghcr (public package storage is free).
      packages: write
      # Dispatch a continuation run when the build hits its time budget.
      actions: write
    env:
      CACHE_WRITE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: just

      # A full BST source build needs tens of GB; reclaim the preinstalled
      # toolchain images hosted runners ship.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/lib/swift || true
          docker image prune -af 2>/dev/null || true
          df -h /

      # Mercury's artifact cache (scripts/bst_ghcr_cache.py): pulls packs
      # from ghcr only when BuildStream asks for them, and on main banks
      # each artifact as soon as it is built, so a timed-out run keeps its
      # progress. Pull requests read it and never write.
      - name: Start artifact cache
        env:
          CACHE_PUSH: ${{ env.CACHE_WRITE == 'true' && '1' || '0' }}
          REGISTRY_USER: ${{ github.actor }}
          # PAT first: GITHUB_TOKEN cannot always read user-namespace packages.
          REGISTRY_TOKEN: ${{ secrets.CACHE_CLEANUP_TOKEN || github.token }}
          CACHE_SOURCE: https://github.com/${{ github.repository }}
          CACHE_PROXY_STORE: ${{ runner.temp }}/cache-proxy
        run: just cache-proxy start

      - name: Generate BuildStream CI config
        uses: ./.github/actions/generate-bst-ci-config
        with:
          cache-push: ${{ env.CACHE_WRITE }}

      - name: Build OCI image with BuildStream
        id: bst
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
        run: |
          set -o pipefail
          mkdir -p logs
          # Stop short of the job limit so logs upload and a continuation
          # can be dispatched. Everything built so far is already cached.
          status=0
          timeout --kill-after=2m 325m just bst build oci/mercury.bst 2>&1 | tee logs/bst-console.log || status=$?
          if [ "$status" = 124 ] || [ "$status" = 137 ]; then
            # timeout signals `just`, not the bst container it started.
            podman ps --format '{{.ID}} {{.Names}}' | awk '$2 != "bst-cache-proxy" {print $1}' | xargs -r podman kill
            echo "timed_out=true" >> "$GITHUB_OUTPUT"
            echo "::warning::BuildStream build hit the time budget; built artifacts are cached"
          fi
          exit "$status"

      - name: Stop artifact cache
        if: always()
        env:
          CACHE_PROXY_LOG: logs/cache-proxy.log
        run: just cache-proxy stop

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buildstream-logs-x86_64
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

      # A cold build can need more than one job's worth of time. Each run
      # resumes from the cache, so continue automatically a bounded number
      # of times instead of waiting for someone to press re-run.
      - name: Continue the build in a new run
        if: >-
          always() && steps.bst.outputs.timed_out == 'true' && env.CACHE_WRITE == 'true' &&
          fromJSON(inputs.continuation || '0') < 3
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ inputs.continuation || '0' }}
        run: |
          NEXT=$((CURRENT + 1))
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f continuation="$NEXT"
          echo "::notice::Dispatched continuation ${NEXT}/3"

  # Export, rechunk, lint, and boot-test the image. On pushes to main this
  # same job continues into signing and publishing so the exported image
  # never leaves the runner — jobs cannot share podman storage.
  image:
    needs: build
    if: (!cancelled()) && needs.build.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign OIDC (main only)
    env:
      # Secure Boot signing and publish steps run only on main / dispatch,
      # never on PR builds: the key secret is not needed there.
      SIGN: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: just

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/lib/swift || true
          docker image prune -af 2>/dev/null || true
          df -h /

      # Read-only: this job stages the Secure Boot private key, so nothing
      # it builds may leave the runner. Its inputs come from the build job's
      # cached artifacts.
      - name: Start artifact cache (read-only)
        env:
          CACHE_PUSH: '0'
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.CACHE_CLEANUP_TOKEN || github.token }}
          CACHE_PROXY_STORE: ${{ runner.temp }}/cache-proxy
        run: just cache-proxy start

      - name: Generate BuildStream CI config
        uses: ./.github/actions/generate-bst-ci-config
        with:
          cache-push: 'false'

      # OWNER TODO: create repo secret MERCURY_SECURE_BOOT_KEY containing the
      # PEM private key from `just secure-boot-keygen`. Without it the
      # main-branch publish fails closed here.
      - name: Write Secure Boot signing key
        if: env.SIGN == 'true'
        env:
          MERCURY_SECURE_BOOT_KEY: ${{ secrets.MERCURY_SECURE_BOOT_KEY }}
        run: |
          if [ -z "$MERCURY_SECURE_BOOT_KEY" ]; then
            echo "::error::MERCURY_SECURE_BOOT_KEY is not configured"
            exit 1
          fi
          umask 077
          printf '%s\n' "$MERCURY_SECURE_BOOT_KEY" > files/boot-keys/private/secure-boot.key

      - name: Sign the Secure Boot chain
        if: env.SIGN == 'true'
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
          BUILD_SECURE_BOOT_SIGNING: 'true'
        run: just bst build boot/secure-boot.bst kernel/signed-modules.bst

      - name: Compose signed image
        if: env.SIGN == 'true'
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
          BUILD_SECURE_BOOT_SIGNING: 'true'
        run: just bst build oci/mercury.bst

      - name: Export OCI image from BuildStream
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
          BUILD_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          BUILD_SECURE_BOOT_SIGNING: ${{ env.SIGN }}
          OCI_IMAGE_REVISION: ${{ github.sha }}
        run: just export default

      - name: Remove Secure Boot signing key
        if: always() && env.SIGN == 'true'
        run: rm -f files/boot-keys/private/secure-boot.key

      - name: Free the BuildStream cache
        run: |
          just cache-proxy stop
          sudo rm -rf "${HOME}/.cache/buildstream" "${RUNNER_TEMP}/cache-proxy"

      - name: Chunkify and lint image
        run: |
          just chunkify "localhost/${IMAGE_NAME}:latest"
          BUILD_IMAGE_NAME="${IMAGE_NAME}" just lint

      # KVM is available on hosted runners. bcvk comes from its release
      # binary, pinned by version and checksum, instead of compiling an
      # unpinned git head on every run.
      - name: Install VM tooling
        env:
          BCVK_VERSION: v0.22.0
          BCVK_SHA256: eb72198c0d36fab75bfcadbb6794a87afa6f496a4da6b1b34d27728243fa6474
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y qemu-system-x86 virtiofsd && break
            [ "$i" = 3 ] && exit 1 || sleep 10
          done
          tarball="${RUNNER_TEMP}/bcvk.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/bootc-dev/bcvk/releases/download/${BCVK_VERSION}/bcvk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${BCVK_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "${RUNNER_TEMP}"
          sudo install -m755 "${RUNNER_TEMP}/bcvk-x86_64-unknown-linux-gnu" /usr/local/bin/bcvk
          bcvk --version

      - name: Boot-test image in an ephemeral VM
        env:
          BOOT_TEST_TIMEOUT: "240"
        run: just boot-test

      # ── Publish (main / dispatch only) ──────────────────────────────────
      - name: Login to GHCR
        if: env.SIGN == 'true'
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | sudo podman login ghcr.io --username "$GH_ACTOR" --password-stdin
          mkdir -p ~/.docker
          echo "$GH_TOKEN" | podman login ghcr.io --username "$GH_ACTOR" --password-stdin \
            --compat-auth-file ~/.docker/config.json

      - name: Push :sha to GHCR
        if: env.SIGN == 'true'
        id: push
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sudo podman tag "localhost/${IMAGE_NAME}:latest" "${IMAGE}:${SHA}"
          ok=false
          for attempt in 1 2 3; do
            if sudo podman push --compression-format=zstd \
              --digestfile "${RUNNER_TEMP}/digest.txt" "${IMAGE}:${SHA}"; then ok=true; break; fi
            echo "push attempt ${attempt} failed"; sleep 5
          done
          $ok || { echo "::error::push failed for ${IMAGE}:${SHA}"; exit 1; }
          DIGEST=$(cat "${RUNNER_TEMP}/digest.txt")
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::malformed digest: $DIGEST"; exit 1; }
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}@${DIGEST}"

      - name: Install cosign
        if: env.SIGN == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image (keyless) and verify
        if: env.SIGN == 'true'
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign -y "${IMAGE}@${DIGEST}"
          # Exact identity, not regexp: only this workflow on main may have signed.
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Tag :latest and :VERSION.DATE
        if: env.SIGN == 'true'
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE_TAG="$(date -u +%Y.%m.%d)"
          for tag in latest "$DATE_TAG"; do
            skopeo copy --preserve-digests \
              --src-creds "$GH_ACTOR:$GH_TOKEN" \
              --dest-creds "$GH_ACTOR:$GH_TOKEN" \
              "docker://${IMAGE}@${DIGEST}" \
              "docker://${IMAGE}:${tag}"
            PROMOTED=$(skopeo inspect --no-tags --creds "$GH_ACTOR:$GH_TOKEN" \
              "docker://${IMAGE}:${tag}" | jq -r '.Digest')
            [ "$PROMOTED" = "$DIGEST" ] || { echo "::error::${tag} points at ${PROMOTED}, expected ${DIGEST}"; exit 1; }
            echo "published ${IMAGE}:${tag} @ ${DIGEST}"
          done
          {
            echo "### Published"
            echo "- \`${IMAGE}:latest\` \`${DIGEST}\`"
            echo "- \`${IMAGE}:${DATE_TAG}\` \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
