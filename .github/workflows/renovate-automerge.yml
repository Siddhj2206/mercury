name: Renovate Auto-merge

# Enables GitHub auto-merge on renovate/* PRs once Validate passes.
# Requires "Allow auto-merge" enabled in repo settings (OWNER TODO).
# GITHUB_TOKEN is enough — no GitHub App needed for a single-maintainer repo.

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    steps:
      - name: Enable auto-merge on renovate PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for pr in $(gh pr list --repo "$GITHUB_REPOSITORY" \
              --search "head:renovate/" \
              --json number --jq '.[].number'); do
            gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --squash \
              || echo "::warning::could not enable auto-merge on PR $pr"
          done
