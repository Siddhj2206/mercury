name: Validate

on:
  pull_request:
    branches: [main]
    # "edited" fires when a PR's base branch changes; re-validate on retarget.
    types: [opened, synchronize, reopened, edited]
  merge_group:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    concurrency:
      group: validate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: just

      - name: Validate workflow and script checks
        run: just check-publish-workflow

      # No actions/cache for the BST CAS: it cannot hold the artifact cache
      # (10 GB limit vs ~100 GB) and `bst show` only needs junctions, which
      # re-fetch in seconds. A real CAS remote is the answer — see
      # docs/ci-research.md.

      - name: Check for dangling submodules
        run: |
          if git ls-files --stage | grep -q '^160000'; then
            echo "ERROR: dangling gitlink(s) found — no submodules allowed in this repo"
            git ls-files --stage | grep '^160000'
            exit 1
          fi

      - name: Check freedesktop-sdk patch drift
        run: just patch-drift-check

      - name: Validate BST element graph
        run: just bst show --deps all oci/mercury.bst
