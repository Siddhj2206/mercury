name: Validate

on:
  pull_request:
    branches: [main]
    # "edited" fires when a PR's base branch changes; re-validate on retarget.
    types: [opened, synchronize, reopened, edited]
  merge_group:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    concurrency:
      group: validate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Just
        uses: taiki-e/install-action@18101caa61cb89118e2ee749786f33c6d1f8a8cb # v2
        with:
          tool: just

      - name: Validate workflow and script checks
        run: just check-publish-workflow

      - name: Test the artifact cache proxy
        run: just test-cache-proxy

      # `bst show` needs only the junctions, which re-fetch in seconds; no
      # artifact cache is involved. Builds use the ghcr artifact cache
      # (docs/ci.md).

      - name: Check for dangling submodules
        run: |
          if git ls-files --stage | grep -q '^160000'; then
            echo "ERROR: dangling gitlink(s) found — no submodules allowed in this repo"
            git ls-files --stage | grep '^160000'
            exit 1
          fi

      - name: Check freedesktop-sdk patch drift
        run: just patch-drift-check

      - name: Validate BST element graph
        run: just bst show --deps all oci/mercury.bst
