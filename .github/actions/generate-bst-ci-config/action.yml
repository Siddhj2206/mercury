name: Generate BuildStream CI config
description: >-
  Write the BuildStream user config for CI: local builds, Mercury's ghcr
  artifact cache (through the `just cache-proxy` server on localhost) first,
  then the public gnome-build-meta and freedesktop-sdk caches.

inputs:
  cache-push:
    description: >-
      Push artifacts built here to Mercury's ghcr cache. Main-branch build
      jobs only; signing jobs and pull requests stay read-only.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Generate BuildStream CI config
      shell: bash
      env:
        CACHE_PUSH: ${{ inputs.cache-push }}
      run: |
        set -euo pipefail
        WORKSPACE_ROOT="${GITHUB_WORKSPACE:-$PWD}"
        mkdir -p "$WORKSPACE_ROOT/logs"

        CONNECTION_CONFIG=$(cat <<'EOF'
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180
        EOF
        )

        # max-jobs is a protected BuildStream variable excluded from cache
        # keys, so giving each build every runner core does not affect
        # artifact reuse; -j1 made LLVM alone take 4.5 h.
        cat > "$WORKSPACE_ROOT/buildstream-ci.conf" <<BSTCONF
        scheduler:
          on-error: continue
          fetchers: 32
          builders: 2
          network-retries: 3

        logging:
          message-format: '[%{wallclock}][%{elapsed}][%{key}][%{element}] %{action} %{message}'
          error-lines: 80

        cachedir: /root/.cache/buildstream
        logdir: /src/logs

        build:
          retry-failed: True
          max-jobs: $(nproc)

        # Mercury's cache answers first: a miss there is a localhost round
        # trip, while a miss on a public cache can cost minutes of retries.
        # The proxy refuses source pushes and skips artifacts the public
        # caches already serve.
        artifacts:
          servers:
          - url: http://127.0.0.1:50051
            push: ${CACHE_PUSH}
          - url: https://gbm.gnome.org:11003
            push: false
        ${CONNECTION_CONFIG}
          - url: https://cache.freedesktop-sdk.io:11001
            push: false
        ${CONNECTION_CONFIG}

        source-caches:
          servers:
          - url: https://gbm.gnome.org:11003
            push: false
        ${CONNECTION_CONFIG}
          - url: https://cache.freedesktop-sdk.io:11001
            push: false
        ${CONNECTION_CONFIG}

        cache:
          cache-buildtrees: never
        BSTCONF

        cp "$WORKSPACE_ROOT/buildstream-ci.conf" "$WORKSPACE_ROOT/logs/buildstream-ci.conf"
        echo "=== BuildStream CI config ==="
        cat "$WORKSPACE_ROOT/buildstream-ci.conf"
